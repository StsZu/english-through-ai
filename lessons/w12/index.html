<style>
  /* ---------- base ---------- */

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);

    font-size: 18px;
    line-height: 1.6;
  }
  main { max-width: 900px; margin: 0 auto; padding: 0 24px 15vh; }
  section { padding: 48px 0 24px; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }
  h1 { font-size: 2em; line-height: 1.2; margin: 0.2em 0; }
  h2 { font-size: 1.5em; margin-top: 0; color: var(--text); }
  h3 { font-size: 1.15em; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  .muted { color: var(--muted); }
  .todo { color: var(--muted); font-style: italic; }

  /* ---------- progress bar ---------- */
  #progress-bar {
    position: fixed; top: 0; left: 0; height: 5px; width: 0;
    background: var(--accent); z-index: 100; transition: width 200ms ease;
  }

  /* ---------- nav ---------- */
  #nav {
    position: sticky; top: 0; z-index: 90;
    display: flex; flex-wrap: wrap; gap: 4px;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 10px 24px; font-size: 0.85em;
  }
  #nav button {
    border: 1px solid transparent; background: none; border-radius: 6px;
    padding: 4px 10px; color: var(--muted);
  }
  #nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #nav .hint { margin-left: auto; color: var(--muted); }

  /* ---------- header section ---------- */
  #sec-header .meta { display: flex; flex-wrap: wrap; gap: 8px 28px; color: var(--muted); }

  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;

    padding: 16px; border: 1px solid var(--border); border-radius: 10px;

  .reading-version.hidden { display: none; }

  .term {

    content: attr(data-def);
    position: absolute; left: 0; bottom: calc(100% + 6px);
    background: var(--text); color: #fff;
    padding: 8px 12px; border-radius: 8px;
    width: max-content; max-width: 36ch;
    font-size: 0.8em; line-height: 1.4; z-index: 50;
  }

  .quiz-progress { color: var(--muted); margin-bottom: 8px; }
  .quiz-prompt { font-size: 1.2em; font-weight: 600; margin-bottom: 16px; }
  .quiz-option {
    display: block; width: 100%; text-align: left;
    margin: 10px 0 0; padding: 14px 16px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--card-bg);
  }
  .quiz-option:not(:disabled):hover { border-color: var(--accent); }
  .quiz-option:disabled { cursor: default; opacity: 0.75; }
  .quiz-option.chosen-correct,
  .quiz-option.revealed-correct { border-color: var(--correct); background: var(--correct-bg); opacity: 1; }
  .quiz-option.chosen-incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); opacity: 1; }
  .option-note {
    margin: 2px 0 10px; padding: 0 16px;
    font-size: 0.82em; color: var(--muted);
  }
  /* The explanation is the main content of the screen after answering. */
  .quiz-explanation {
    margin: 20px 0; padding: 20px 22px; border-radius: 10px;
    background: var(--accent-soft); border-left: 4px solid var(--accent);
    font-size: 1em; line-height: 1.65;
    opacity: 0; transition: opacity 200ms ease;
  }
  .quiz-explanation.show { opacity: 1; }
  .quiz-explanation .verdict { font-weight: 700; display: block; margin-bottom: 6px; }
  .quiz-explanation .verdict.v-correct { color: var(--correct); }
  .quiz-explanation .verdict.v-incorrect { color: var(--incorrect); }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 22px; font-weight: 600;
  }
  .quiz-print-note { display: none; }

  /* ---------- speaking ---------- */
  .speaking-item { margin: 28px 0; }
  .speaking-item .prompt-text { font-size: 1em; font-weight: normal; line-height: 1.6; margin: 0 0 10px; }
  .speaking-item .timer { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .timer-display { font-variant-numeric: tabular-nums; font-size: 1.2em; color: var(--muted); min-width: 3.5ch; }
  .timer-display.running { color: var(--accent); font-weight: 700; }
  .timer-display.done { color: var(--correct); font-weight: 700; }
  .timer button { border: 1px solid var(--border); background: var(--card-bg); border-radius: 8px; padding: 6px 14px; }

  /* ---------- homework ---------- */
  .hw-item { display: flex; gap: 12px; align-items: baseline; margin: 10px 0; }
  .hw-item input { width: 20px; height: 20px; accent-color: var(--accent); }
  .hw-item input:checked + label { color: var(--muted); text-decoration: line-through; }

  /* ---------- presentation mode ---------- */
  body.presentation { font-size: 26px; }
  body.presentation #nav { display: none; }
  body.presentation main { max-width: 1100px; }
  body.presentation section { display: none; border: none; min-height: 92vh; padding-top: 6vh; }
  body.presentation section.active { display: block; }

  /* ---------- vocab quiz ---------- */
  #vocab-quiz-block { margin-top: 48px; padding-top: 32px; border-top: 1px dashed var(--border); }

  /* ---------- print ---------- */
  @media print {
    #nav, #progress-bar, .timer, .btn-primary, .toggle, #vocab-quiz-block { display: none !important; }
    body { font-size: 12pt; background: #fff; }
    section { display: block !important; border-bottom: 1px solid #ccc; page-break-inside: avoid; }
    /* reading expanded: both versions visible with their labels */
    .reading-version.hidden { display: block; }
    .reading-version > h3.print-only { display: block; }
    /* quiz collapsed: interactive body hidden, note shown */
    #quiz-app { display: none; }
    .quiz-print-note { display: block; color: var(--muted); }
  }
</style>

  "reading": {
    "b1": "Diligence is the fourth core competency of the AI fluency framework. It focuses on ethical responsibility, safety, and transparency. AI interactions do not exist in a **vacuum**. We must consider the broader ethical **implication**s of our tools on colleagues, clients, and society.\n\nDiligence consists of three interconnected dimensions. First is **creation diligence**. This requires you to be intentional about which AI platforms you choose. You evaluate data privacy, training origins, and company security policies before sharing sensitive technical files.\n\nSecond is **transparency diligence**. You must be **forthright** about AI's role in your work. Different professional environments have clear expectations of **disclosure**. Being open about AI assistance builds long-term trust and mutual respect across engineering teams.\n\nThird is **deployment diligence**. When sharing deliverables, the human author is ultimately responsible. You verify factual claims, check code for security bugs, and ensure you can **stand behind** the final release. Developers should **familiarize** themselves with evolving legal and organizational standards.\n\nFinally, professionals draft a formal **diligence statement**. This document acknowledges that AI was **instrumental** during research and scaffolding. However, the author **affirm**s complete personal responsibility for technical correctness. Diligence ensures that AI collaboration remains ethical, rigorous, and safe.",
    "original": "---\nTotal video duration in this module: 15 min\nWord count (wc -w): 1693\nWords per minute: 113\nVerdict: <130 comfortable\n---\n\n# A closer look at Diligence\n\nBy the end of this lesson, you'll be able to:\n\n- Understand the ethical implications of AI collaboration\n- Understand the importance of transparency in AI work\n- Recognize your responsibility in AI interactions and outputs\n\n## Video: A closer look at diligence\n\nHere is the polished transcript, kept as close as possible to the original spoken structure.\n\nIn this video, we'll examine the diligence competency from the AI fluency framework. Remember that AI fluency means working with AI effectively, efficiently, ethically, and safely.\n\nWhile the other three competencies primarily address effectiveness and efficiency, diligence focuses mostly on the ethical and safety aspects that are just as crucial for successful AI collaboration. At its heart, diligence is about taking responsibility for your AI interactions. It's the dimension of AI fluency that ensures your use of AI systems is not only productive, but also rigorous, transparent, and accountable.\n\nUnlike the other competencies that primarily focus on getting results, diligence asks us to consider broader questions that are nevertheless critical to AI collaboration, particularly in professional environments, such as: What are the implications of working with this AI? Who might be affected by what is created, or by the collaboration itself, or by any missed inaccuracies? Who has access to the data used to produce this output? How do I ensure that my interaction and the outcome align with ethical standards and values?\n\nThink about it like driving a car. We don't just focus on getting from point A to point B efficiently. We also consider safety, follow traffic rules, and remain aware of how our driving affects others on the road. Similarly, diligence recognizes that AI systems and our interactions with them don't exist in a vacuum. Working with AI responsibly requires awareness of broader contexts and their implications.\n\nDiligence begins with becoming more critically thoughtful about which AI systems we work with, how we work with them, and the impacts that come from those collaborations. We should seek answers to questions like: How is this system trained and built? What data was used? Who owns the data I'm inputting right now? Who may have access to it once it's shared? How am I protecting the privacy and security of myself and others? What other impacts does this system have? How does this interaction align with my personal and professional values or with my organization's policies?\n\nFor example, before sharing sensitive company information with an AI assistant, it's important to first check whether the service has appropriate data protection policies in place or if your organization permits such sharing.\n\nWe call this type of diligence creation diligence. It is your ability to be critical and intentional about which AI systems you choose to work with and how you work with them.\n\nDifferent settings—personal, academic, creative, and professional—may have different expectations of disclosure about AI interaction. However, the responsibility is on each of us to understand and meet these expectations.\n\nAsk yourself: Who needs to know about AI's role in this work? How and when should I communicate this? What level of detail makes sense to share?\n\nMeeting expectations for transparency—in other words, being forthright and honest—isn't just about following rules and regulations. It's about maintaining trust and respect in your relationships. It acknowledges that people have the right to know when AI has played a significant role in content creation or in decisions that affect them.\n\nFor instance, if you used AI to help draft a team proposal, letting your colleagues know which parts were AI-assisted allows for a more honest collaboration and keeps everyone on the same page.\n\nWe call this transparency diligence. It's the ability to be open and accurate about AI interaction with everyone who needs to know.\n\nAs we discussed before, AI systems can make mistakes. When you share AI-generated content with the world, you, not the AI, are ultimately responsible for its accuracy and appropriateness. This means verifying facts, checking for biases, ensuring accuracy and usage rights, and other checks needed so that you can stand behind what you share.\n\nConsider a journalist who uses AI to help draft an article. Before publishing, they would need to verify every fact and source, and ensure that the final piece meets every journalistic standard—the same standards that would apply had they written it entirely themselves.\n\nWe call this deployment diligence. It's the ability to take informed responsibility for the outputs that you use or share after they've been created with AI assistance.\n\nNavigating these diligence considerations isn't always straightforward. Different contexts and stakeholders may have different expectations and standards. So it helps to develop personal guidelines for working with AI that align with your own ethics and values. And in professional contexts, familiarize yourself with organizational policies and industry standards.\n\nAnd remember that the legal and regulatory frameworks around AI are still emerging and will continue to evolve. Staying informed is an important part of diligence.\n\nTo recap, creation, transparency, and deployment diligence work together to form the complete diligence competency. By developing your capacity for diligence, you ensure that your AI use is not only effective and efficient, but also ethical and safe.\n\nDiligence reminds us that our interaction with AI comes with responsibilities: to be thoughtful about the systems we choose and about how we work with them, to be honest about AI's role in our work, and ultimately to be accountable for what we create when working with AI.\n\nWe all want AI that is fair and safe and of benefit to our society. Our own behaviors play a key role in making this happen.\n\n===\n\nThis video explores Diligence, the AI Fluency competency that focuses on responsible and ethical AI collaborations. We explain that while the other competencies primarily address effectiveness and efficiency, Diligence addresses ethical and safety aspects that are equally crucial. We introduce three components:\n\n- Creation Diligence: Being thoughtful about which AI systems you choose and how you work with them\n- Transparency Diligence: Being open about AI's role in your work\n- Deployment Diligence: Taking ownership for AI-assisted outputs you share with others\n\nWe emphasize that different contexts may have different expectations, but we each have a responsibility to understand and meet these expectations.\n\n#### Key takeaways\n\n- Diligence is about taking responsibility for our AI collaborations\n- Creation Diligence involves being thoughtful about which AI systems we use and how we engage with them\n- Transparency Diligence means being honest about AI's role in our work with everyone who needs to know\n- Deployment Diligence requires taking responsibility for verifying and vouching for the outputs we use or share\n- Different contexts (personal, academic, professional) may have different expectations for disclosure and verification\n- Thoughtful Diligence helps ensure our AI collaborations are not only effective and efficient, but also ethical and safe\n\n## Exercises\n\n#### Exercise: Creating a Diligence Statement\n\n*Estimated time: 14 minutes*\n\nIn this exercise, you'll draft a diligence statement for the project you’ve been working on. Here is the [diligence statement](https://www-cdn.anthropic.com/0e37fa9da01fab7a5478a2194d352027794c1b89.pdf) for this course itself.\n\n#### **Step 1: Understand Diligence Statements**\n\n*Estimated time: 3 minutes*\n\nA diligence statement is a transparent acknowledgment of AI's role in your work, along with your commitment to responsibility for the final output. Here's an example:\n\n\"In creating this [document/project/content], I collaborated with [AI assistant name] to assist with [specific tasks: drafting, research, editing, etc.]. I affirm that all AI-generated and co-created content underwent thorough review and evaluation. The final output accurately reflects my understanding, expertise, and intended meaning. While AI assistance was instrumental in the process, I maintain full responsibility for the content, its accuracy, and its presentation. This disclosure is made in the spirit of transparency and to acknowledge the role of AI in the creation process.\"\n\n#### Step 2: Reflect on Your AI Collaboration\n\n*Estimated time: 5 minutes*\n\nThink about your work on the course project and consider:\n\n- Creation Diligence:\n  - Which AI systems did you choose to work with and why?\n  - What data or information did you share with the AI?\n  - Were there any privacy, security, or ethical considerations in your choices?\n- Transparency Diligence:\n  - Who is the audience for your project output?\n  - What expectations might they have regarding AI disclosure?\n  - How specifically did AI contribute to different aspects of your work?\n- Deployment Diligence:\n  - What steps did you take to verify the accuracy and appropriateness of AI contributions?\n  - How did you ensure the final output meets your standards and requirements?\n  - What responsibility are you taking for the final product?\n\n#### Step 3: Draft Your Diligence Statement\n\n*Estimated time: 6 minutes*\n\nOpen a conversation with Claude and:\n\n1. Share your reflections from Step 2, as well as optionally your past conversations that you’ve had with Claude about this project\n2. Collaborate with Claude to draft a diligence statement specific to your project\n3. Ensure your statement addresses:\n   1. Which AI systems you used\n   2. How the AI contributed to your project\n   3. The review process you employed\n   4. Your assertion of responsibility for the final output\n   5. Any context-specific considerations (academic, professional, etc.)\n\n#### Step 4: Add Your Statement to Your Project\n\nWhen you finish your project, add your diligence statement in an appropriate location (e.g., footer, appendix, or metadata).\n\n### Reflection\n\nBefore moving on, take a moment to consider:\n\n- Which aspect of Diligence (Creation, Transparency, or Deployment) do you find most challenging, and why?\n- How might your approach to Diligence vary depending on the context (personal, academic, professional)?\n- How does acknowledging AI's role in your work affect how others might perceive it?\n- What ethical considerations arose during your project that you hadn't anticipated?\n- What personal guidelines might you develop for responsible AI collaboration going forward?\n\n#### What’s next\n\nIn the final lesson of this course, we'll reflect on what we've learned about AI Fluency and how these competencies work together. We'll revisit the framework as a whole and discuss how you can continue developing these skills as AI capabilities evolve. The conclusion will help you synthesize the knowledge and practices you've gained and apply them to future AI collaborations.\n"
  },

<script>
"use strict";
const data = JSON.parse(document.getElementById("lesson-data").textContent);
const LS = key => "etai:" + data.week + ":" + key;
document.title = data.week.toUpperCase() + " — " + data.title;

/* ---------- tiny helpers ---------- */
const el = (tag, attrs, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (child == null) continue;
    node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
};
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const escAttr = s => escHtml(s).replace(/"/g, "&quot;");
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const isTodo = s => typeof s === "string" && /^\s*TODO/i.test(s);

/* Fisher-Yates: an unbiased shuffle. sort(() => Math.random() - 0.5) is not. */
const shuffled = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* Quiz explanations point at options with {{opt:b}} / {{opt:b,c}} instead of
   naming a position, so the text stays true after the options are shuffled.
   The token resolves to the ordinal of where that option actually sits now. */
const ORDINAL_WORDS = ["first", "second", "third", "fourth"];
const resolveOptionRefs = (text, order) =>
  String(text).replace(/\{\{opt:([a-z](?:,[a-z])*)\}\}/g, (whole, ids) => {
    const positions = ids.split(",").map(id => order.findIndex(o => o.id === id));
    if (positions.some(i => i < 0 || i >= ORDINAL_WORDS.length)) return whole;
    return positions.sort((x, y) => x - y).map(i => ORDINAL_WORDS[i]).join(" and ");
  });

/* Minimal markdown: ## headings, - lists, paragraphs, **bold**, *italic*. */
function mdToHtml(md) {
  const inline = s => s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return md.trim().split(/\n\s*\n/).map(block => {
    const b = block.trim();
    const h = b.match(/^(#{1,4})\s+(.*)$/s);
    if (h) return "<h3>" + inline(escHtml(h[2])) + "</h3>";
    const lines = b.split("\n").map(l => l.trim());
    if (lines.every(l => /^[-*]\s+/.test(l)))
      return "<ul>" + lines.map(l => "<li>" + inline(escHtml(l.replace(/^[-*]\s+/, ""))) + "</li>").join("") + "</ul>";
    return "<p>" + inline(escHtml(b)).replace(/\n/g, "<br>") + "</p>";
  }).join("\n");
}

/* Wrap vocabulary terms in the reading text with a tooltip span.
   Single-pass alternation regex, applied to text between tags only. */
function highlightTerms(html) {
  const vocab = data.vocabulary.filter(v => v.term && !isTodo(v.term));
  if (!vocab.length) return html;
  const byTerm = {};
  vocab.forEach(v => { byTerm[v.term.toLowerCase()] = v; });
  const re = new RegExp("\\b(" + vocab.map(v => escRe(v.term))
    .sort((a, b) => b.length - a.length).join("|") + ")\\b", "gi");
  return html.split(/(<[^>]+>)/).map(part => {
    if (part.startsWith("<")) return part;
    return part.replace(re, m => {
      const v = byTerm[m.toLowerCase()];
      const def = isTodo(v.definition_b1) ? "definition coming soon" : v.definition_b1;
      return '<span class="term" tabindex="0" data-def="' + escAttr(def) + '">' + m + "</span>";
    });
  }).join("");
}

/* ---------- section builders ---------- */
const main = document.getElementById("sections");
const addSection = (id, title, node) => {
  const s = el("section", { id: "sec-" + id });
  if (title) s.append(el("h2", {}, title));
  s.append(node);
  main.append(s);
  return s;
};

/* 1. Header */
{
  const s = el("div", {},
    el("p", { class: "muted" }, "English Through AI — Week " + data.week.replace(/^w0?/, "")),
    el("h1", {}, data.title),
    el("div", { class: "meta" },
      el("span", {}, "Source: " + data.source),
      el("span", {}, "Duration: " + data.duration_min + " min")
    )
  );
  addSection("header", null, s);
}

/* 2. Objectives */
{
  const ul = el("ul", {});
  data.objectives.forEach(o => ul.append(el("li", { class: isTodo(o) ? "todo" : "" }, o)));
  addSection("objectives", "Objectives", ul);
}

/* 3. Vocabulary — flip cards + quick quiz */
{
  const wrap = el("div", {});
  const grid = el("div", { id: "vocab-grid" });
  data.vocabulary.forEach(v => {
    const back = el("div", { class: "card-face card-back" },
      el("strong", {}, v.term),
      el("span", { class: isTodo(v.definition_b1) ? "todo" : "" }, v.definition_b1),
      el("span", { class: "colloc" }, (v.collocations || []).join(" · ")),
      el("span", { class: "ua" }, v.ua)
    );
    const card = el("div", { class: "card", tabindex: "0", role: "button",
        "aria-label": "Vocabulary card: " + v.term },
      el("div", { class: "card-inner" },
        el("div", { class: "card-face card-front" }, v.term), back));
    const flip = () => card.classList.toggle("flipped");
    card.addEventListener("click", flip);
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
    grid.append(card);
  });
  wrap.append(grid);

  const validTerms = data.vocabulary.filter(v => v.term && !isTodo(v.term) && v.definition_b1 && !isTodo(v.definition_b1));
  if (validTerms.length >= 3) {
    const quizBlock = el("div", { id: "vocab-quiz-block" },
      el("h3", {}, "Vocabulary Quiz"),
      el("p", { class: "muted" }, "Match the definition with the correct word.")
    );
    const app = el("div", { id: "vocab-quiz-app", style: "margin-top: 16px;" });
    quizBlock.append(app);
    wrap.append(quizBlock);

    const shuffle = shuffled;
    let qList = shuffle(validTerms);
    let qIdx = 0;
    let score = 0;

    function renderVocabQ() {
      app.replaceChildren();
      const current = qList[qIdx];
      const otherTerms = validTerms.filter(t => t.term !== current.term);
      const distractors = shuffle(otherTerms).slice(0, 2);
      const opts = shuffle([current, ...distractors]);

      const progress = el("p", { class: "quiz-progress" }, "Question " + (qIdx + 1) + " of " + qList.length);
      const prompt = el("p", { class: "quiz-prompt", style: "font-weight: 500;" }, current.definition_b1);
      app.append(progress, prompt);

      const buttons = [];
      opts.forEach(item => {
        const btn = el("button", { class: "quiz-option" }, item.term);
        btn.addEventListener("click", () => {
          buttons.forEach(b => {
            b.disabled = true;
            if (b.dataset.term === current.term) b.classList.add(b === btn ? "chosen-correct" : "revealed-correct");
            else if (b === btn) b.classList.add("chosen-incorrect");
          });
          if (item.term === current.term) score++;

          const next = el("button", { class: "btn-primary", style: "margin-top: 18px;" },
            qIdx + 1 < qList.length ? "Next word" : "Finish");
          next.addEventListener("click", () => {
            qIdx++;
            qIdx < qList.length ? renderVocabQ() : renderVocabSummary();
          });
          app.append(next);
        });
        btn.dataset.term = item.term;
        buttons.push(btn);
        app.append(btn);
      });
    }

    function renderVocabSummary() {
      app.replaceChildren(
        el("h3", {}, "Result: " + score + " / " + qList.length),
        el("p", { class: "muted" }, score === qList.length ? "Perfect score! All terms mastered." : "Great practice!"),
        el("button", { class: "btn-primary", style: "margin-top: 12px;", onclick: () => {
          qList = shuffle(validTerms);
          qIdx = 0;
          score = 0;
          renderVocabQ();
        } }, "Restart quiz")
      );
    }

    renderVocabQ();
  }

  addSection("vocabulary", "Vocabulary", wrap);
}

/* 4. Reading — B1 / Original toggle, terms highlighted */
{
  const wrap = el("div", {});
  const mkVersion = (id, label, text) => {
    const d = el("div", { class: "reading-version", id: "reading-" + id });
    d.innerHTML = '<h3 class="print-only">' + label + "</h3>" +
      (isTodo(text) ? '<p class="todo">' + escHtml(text) + "</p>" : highlightTerms(mdToHtml(text)));
    return d;
  };
  const b1 = mkVersion("b1", "B1 version", data.reading.b1);
  const orig = mkVersion("orig", "Original transcript", data.reading.original);
  orig.classList.add("hidden");
  const btnB1 = el("button", { class: "active" }, "B1 version");
  const btnOrig = el("button", {}, "Original transcript");
  const select = which => {
    b1.classList.toggle("hidden", which !== "b1");
    orig.classList.toggle("hidden", which !== "orig");
    btnB1.classList.toggle("active", which === "b1");
    btnOrig.classList.toggle("active", which === "orig");
  };
  btnB1.addEventListener("click", () => select("b1"));
  btnOrig.addEventListener("click", () => select("orig"));
  wrap.append(el("div", { class: "toggle" }, btnB1, btnOrig), b1, orig);
  addSection("reading", "Reading", wrap);
}

/* 5. Quiz */
{
  const app = el("div", { id: "quiz-app" });
  const note = el("p", { class: "quiz-print-note" },
    "The quiz is interactive — open this file in a browser to take it.");
  const state = { i: 0, score: 0, reviewTerms: new Set() };

  function renderQuestion() {
    app.replaceChildren();
    const q = data.quiz[state.i];
    app.append(
      el("p", { class: "quiz-progress" }, "Question " + (state.i + 1) + " of " + data.quiz.length),
      el("p", { class: "quiz-prompt" }, q.prompt)
    );
    /* Options are shuffled on every render: the correct answer must not be
       findable by position, and a re-taken quiz must not be muscle memory. */
    const order = shuffled(q.options);
    const rows = [];
    order.forEach(opt => {
      const btn = el("button", { class: "quiz-option" }, opt.text);
      const note = el("p", { class: "option-note", hidden: "" },
        resolveOptionRefs(opt.note, order));
      btn.addEventListener("click", () => answer(q, opt, rows, order));
      rows.push({ opt, btn, note });
      app.append(btn, note);
    });
  }

  function answer(q, chosen, rows, order) {
    /* Lock all options: no re-selection — that would spoil the exercise. */
    rows.forEach(({ opt, btn, note }) => {
      btn.disabled = true;
      /* The correct option is always revealed, even when not chosen. */
      if (opt.correct) btn.classList.add(opt === chosen ? "chosen-correct" : "revealed-correct");
      else if (opt === chosen) btn.classList.add("chosen-incorrect");
      note.hidden = false;
    });
    if (chosen.correct) state.score++;
    else (q.term_refs || []).forEach(t => state.reviewTerms.add(t));

    /* One explanation per question — the main content after answering. */
    const exp = el("div", { class: "quiz-explanation" },
      el("span", { class: "verdict " + (chosen.correct ? "v-correct" : "v-incorrect") },
        chosen.correct ? "Correct" : "Not quite"),
      resolveOptionRefs(q.explanation, order));
    const next = el("button", { class: "btn-primary" },
      state.i + 1 < data.quiz.length ? "Next" : "Finish");
    next.addEventListener("click", () => {
      state.i++;
      state.i < data.quiz.length ? renderQuestion() : renderSummary();
    });
    app.append(exp, next);
    requestAnimationFrame(() => requestAnimationFrame(() => exp.classList.add("show")));
  }

  function renderSummary() {
    app.replaceChildren(
      el("h3", {}, "Result: " + state.score + " / " + data.quiz.length),
      state.reviewTerms.size
        ? el("div", {}, el("p", {}, "Terms to review:"),
            el("ul", {}, ...[...state.reviewTerms].map(t => el("li", {}, t))))
        : el("p", {}, "Nothing flagged for review — well done."),
      el("button", { class: "btn-primary", onclick: () => {
        state.i = 0; state.score = 0; state.reviewTerms.clear(); renderQuestion();
      } }, "Restart quiz")
    );
  }

  if (data.quiz.length) renderQuestion();
  else app.append(el("p", { class: "todo" }, "TODO: quiz questions"));
  const holder = el("div", {}, app, note);
  addSection("quiz", "Quiz", holder);
}

/* 6. Speaking prompts — big type, 60 s timer each */
{
  const wrap = el("div", {});
  data.speaking_prompts.forEach(p => {
    const display = el("span", { class: "timer-display" }, "60");
    const btn = el("button", {}, "Start 60 s");
    let interval = null;
    btn.addEventListener("click", () => {
      clearInterval(interval);
      let left = 60;
      display.textContent = left;
      display.className = "timer-display running";
      interval = setInterval(() => {
        left--;
        display.textContent = left;
        if (left <= 0) {
          clearInterval(interval);
          display.textContent = "Time!";
          display.className = "timer-display done";
        }
      }, 1000);
    });
    wrap.append(el("div", { class: "speaking-item" },
      el("p", { class: "prompt-text " + (isTodo(p) ? "todo" : "") }, p),
      el("div", { class: "timer" }, btn, display)));
  });
  addSection("speaking", "Speaking", wrap);
}

/* 7. Homework — checklist persisted to localStorage */
{
  const wrap = el("div", {});
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(LS("homework")) || "[]"); } catch (e) { saved = []; }
  data.homework.forEach((h, i) => {
    const cb = el("input", { type: "checkbox", id: "hw-" + i });
    cb.checked = !!saved[i];
    cb.addEventListener("change", () => {
      saved[i] = cb.checked;
      localStorage.setItem(LS("homework"), JSON.stringify(saved));
    });
    wrap.append(el("div", { class: "hw-item" }, cb,
      el("label", { for: "hw-" + i, class: isTodo(h) ? "todo" : "" }, h)));
  });
  addSection("homework", "Homework", wrap);
}

/* ---------- navigation, presentation mode, progress ---------- */
const sections = [...document.querySelectorAll("main > section")];
const nav = document.getElementById("nav");
const bar = document.getElementById("progress-bar");
const navButtons = sections.map((s, i) => {
  const label = s.querySelector("h2") ? s.querySelector("h2").textContent : "Start";
  const b = el("button", { onclick: () => setCurrent(i, true) }, label);
  nav.append(b);
  return b;
});
nav.append(el("span", { class: "hint" }, "← → sections · P presentation · F fullscreen"));

let current = 0;
function setCurrent(i, scroll) {
  current = Math.max(0, Math.min(sections.length - 1, i));
  navButtons.forEach((b, j) => b.classList.toggle("active", j === current));
  sections.forEach((s, j) => s.classList.toggle("active", j === current));
  bar.style.width = ((current + 1) / sections.length * 100) + "%";
  if (scroll && !document.body.classList.contains("presentation"))
    sections[current].scrollIntoView({ behavior: "smooth", block: "start" });
  if (document.body.classList.contains("presentation")) window.scrollTo(0, 0);
}
setCurrent(0, false);

document.addEventListener("keydown", e => {
  const t = e.target.tagName;
  if (t === "INPUT" || t === "TEXTAREA" || t === "AUDIO") return;
  if (e.key === "ArrowRight") setCurrent(current + 1, true);
  else if (e.key === "ArrowLeft") setCurrent(current - 1, true);
  else if (e.key === "f" || e.key === "F") {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  } else if (e.key === "p" || e.key === "P") {
    document.body.classList.toggle("presentation");
    setCurrent(current, false);
  }
});
</script>
