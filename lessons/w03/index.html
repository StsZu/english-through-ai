  /* ---------- base ---------- */

  html { scroll-behavior: smooth; }
  body {

    line-height: 1.6;
  }
  main { max-width: 900px; margin: 0 auto; padding: 0 24px 15vh; }
  section { padding: 48px 0 24px; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }
  h1 { font-size: 2em; line-height: 1.2; margin: 0.2em 0; }
  h2 { font-size: 1.5em; margin-top: 0; color: var(--text); }
  h3 { font-size: 1.15em; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  .muted { color: var(--muted); }
  .todo { color: var(--muted); font-style: italic; }

  /* ---------- progress bar ---------- */
  #progress-bar {
    position: fixed; top: 0; left: 0; height: 5px; width: 0;
    background: var(--accent); z-index: 100; transition: width 200ms ease;
  }

  /* ---------- nav ---------- */
  #nav {
    position: sticky; top: 0; z-index: 90;
    display: flex; flex-wrap: wrap; gap: 4px;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 10px 24px; font-size: 0.85em;
  }
  #nav button {
    border: 1px solid transparent; background: none; border-radius: 6px;
    padding: 4px 10px; color: var(--muted);
  }
  #nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #nav .hint { margin-left: auto; color: var(--muted); }

  /* ---------- header section ---------- */
  #sec-header .meta { display: flex; flex-wrap: wrap; gap: 8px 28px; color: var(--muted); }

  /* ---------- vocabulary cards ---------- */
  #vocab-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px; perspective: 1200px;
  }
  .card { min-height: 200px; cursor: pointer; outline-offset: 3px; }
  .card-inner {
    position: relative; width: 100%; height: 100%; min-height: 200px;
    transition: transform 400ms; transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; justify-content: center;
    padding: 16px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card-bg);

  .card-front { align-items: center; font-size: 1.25em; font-weight: 600; text-align: center; }
  .card-back { transform: rotateY(180deg); font-size: 0.9em; gap: 6px; }
  .card-back .colloc { color: var(--accent); }
  .card-back .ua { color: var(--muted); }

  .toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }

    margin: 2px 0 10px; padding: 0 16px;

    margin: 20px 0; padding: 20px 22px; border-radius: 10px;

    font-size: 1em; line-height: 1.65;

  .quiz-explanation .verdict.v-correct { color: var(--correct); }
  .quiz-explanation .verdict.v-incorrect { color: var(--incorrect); }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 22px; font-weight: 600;
  }
  .quiz-print-note { display: none; }

  /* ---------- speaking ---------- */
  .speaking-item { margin: 28px 0; }
  .speaking-item .prompt-text { font-size: 1em; font-weight: normal; line-height: 1.6; margin: 0 0 10px; }
  .speaking-item .timer { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .timer-display { font-variant-numeric: tabular-nums; font-size: 1.2em; color: var(--muted); min-width: 3.5ch; }
  .timer-display.running { color: var(--accent); font-weight: 700; }
  .timer-display.done { color: var(--correct); font-weight: 700; }
  .timer button { border: 1px solid var(--border); background: var(--card-bg); border-radius: 8px; padding: 6px 14px; }

  /* ---------- homework ---------- */
  .hw-item { display: flex; gap: 12px; align-items: baseline; margin: 10px 0; }
  .hw-item input { width: 20px; height: 20px; accent-color: var(--accent); }
  .hw-item input:checked + label { color: var(--muted); text-decoration: line-through; }

  /* ---------- presentation mode ---------- */
  body.presentation { font-size: 26px; }
  body.presentation #nav { display: none; }
  body.presentation main { max-width: 1100px; }
  body.presentation section { display: none; border: none; min-height: 92vh; padding-top: 6vh; }
  body.presentation section.active { display: block; }

  /* ---------- pronunciation ---------- */
  .pron-item {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 4px 16px; align-items: baseline;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .pron-item:last-child { border-bottom: none; }
  .pron-item .stress {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em; color: var(--accent);
  }
  .pron-item .why { grid-column: 1 / -1; font-size: 0.9em; }
  @media (max-width: 600px) {
    .pron-item { grid-template-columns: 1fr; }
  }
  .card-face .example { font-style: italic; font-size: 0.85em; }

  /* ---------- vocab quiz ---------- */
  #vocab-quiz-block { margin-top: 48px; padding-top: 32px; border-top: 1px dashed var(--border); }

  /* ---------- print ---------- */
  @media print {
    #nav, #progress-bar, .timer, .btn-primary, .toggle, #vocab-quiz-block { display: none !important; }
    body { font-size: 12pt; background: #fff; }
    section { display: block !important; border-bottom: 1px solid #ccc; page-break-inside: avoid; }
    /* reading expanded: both versions visible with their labels */
    .reading-version.hidden { display: block; }
    .reading-version > h3.print-only { display: block; }
    /* quiz collapsed: interactive body hidden, note shown */
    #quiz-app { display: none; }
    .quiz-print-note { display: block; color: var(--muted); }
  }
</style>

  "reading": {
    "b1": "Rick Dacon from Ringling College introduces the **4D framework**. This framework guides human-AI collaboration across **automation**, **augmentation**, and **agency**. The goal is effective, efficient, ethical, and safe interaction. Four core **competencies** make the difference. They are **delegation**, **description**, **discernment**, and **diligence**.\n\n**Delegation** focuses on the big picture. You decide what work to handle yourself. You decide where AI can help. Effective delegation is not just about **offload**ing tasks. It requires a clear vision and strategic division of labor. For example, AI can review long documents. However, humans should keep critical analysis and final conclusions.\n\n**Description** is about clear communication. It goes far beyond short prompt commands. It means having **context-rich** conversations with AI. You should **articulate** your goal, format, context, and preferred tone clearly. For instance, you can ask AI to teach step by step instead of giving the answer.\n\n**Discernment** means evaluating AI outputs thoughtfully. You check if facts are accurate and logical. You verify whether suggestions **align with** your goals. Domain expertise helps you separate useful output from flawed output. You decide when AI ideas need **refinement** or when to **set aside** bad suggestions. Most interactions form small loops of **description** and **discernment**.\n\n**Diligence** focuses on responsible interaction. Users must ensure **fairness** and control for **bias** in AI decisions. They must protect sensitive data and maintain **transparency**. Diligence means taking ownership. You must be ready to **stand behind** any AI-assisted work.\n\nThese core **competencies** help learners **navigate** AI collaboration confidently. They are lasting skills that adapt as technology continues to change.",
    "original": "# w03 — source material\n\nRaw text collected from Coursera. No editing, no cleaning.\nReadings: select the page text and paste it.\nVideos: use the Transcript tab under the player, not Subtitles.\n\nSeparator format:\n\n--- reading: <title> ---\n--- video N: <title> (MM:SS) ---\n\nTotal video duration in this module: ___ min\nWord count (wc -w): ___\nWords per minute: ___\n\n\n\n# The 4D Framework\n\n## What you’ll learn\n\nBy the end of this lesson you will be able to:\n\n- Explain the basic AI Fluency Framework and its core \"4Ds\": Delegation, Description, Discernment, and Diligence\n\n## The 4D framework\n\nHere is the polished transcript, kept as close as possible to the original spoken structure.\n\nHi, my name is Rick Dacon from the Ringling College of Art and Design. Now that we've explored what AI fluency means and the different ways we interact with AI, let's dive into the core competencies that help us navigate AI collaboration effectively, efficiently, ethically, and safely.\n\nNo matter how you're working with AI, whether through automation, augmentation, or agency, there are four essential competencies that make all the difference. We call them the four Ds: delegation, description, discernment, and diligence.\n\nFirst is delegation, which focuses on the big picture. What are you trying to accomplish? What kinds of work are involved? What work should you handle yourself? And where might AI be helpful?\n\nThink about a research project you're working on. You might decide to have your AI assistant review lengthy documents and data, then engage in a thoughtful discussion about the implications and findings, but reserve the critical analysis and final conclusions for yourself.\n\nTo delegate effectively, you need to understand your goal and the problem you're solving, recognize what AI can and can't do well, and, lastly, thoughtfully divide the work between you and the AI.\n\nDelegation isn't just about offloading tasks. It's about having a clear vision and strategically choosing how AI fits into your process. This thoughtful approach is essential for both effective and efficient AI collaboration.\n\nNext comes description, which focuses on clear communication with AI. Consider the difference between vaguely stating, \"Make me a logo,\" versus describing your company's values, target audience, preferred colors, style references, and so on.\n\nOr, if you're using an AI as a tutor, you might take the extra step to specify, \"Don't tell me the answer. Just help me work through this problem step by step so I can better understand the concept.\"\n\nDescription goes beyond just writing prompts. It's about having detailed, context-rich conversations that establish what you're hoping to achieve, the format of the output, how you want the AI to approach the task, the context and information that the AI might need to best work with you on this task, and the tone and style of interaction.\n\nEffective description means articulating your needs and vision in a way that sets up both you and the AI for the greatest collaborative success.\n\nThe third D is discernment, which involves thoughtfully evaluating what AI gives you. Let's say you've asked an AI assistant to suggest a marketing strategy. Your discernment comes into play as you assess: Are the facts accurate? Does the reasoning make sense? Do the recommendations align with your brand values and audience? And most importantly, does this output actually help you move forward?\n\nDiscernment draws upon your own expertise in a domain and requires developing the judgment and critical insight to separate what's useful from what's not, and to recognize when AI outputs need refinement or should be set aside entirely.\n\nMost of our interactions with AI involve small loops of description and discernment: describing what we need, evaluating what we get, refining our request, and so on. We'll explore this more deeply later in the course.\n\nFinally, there's diligence, which focuses on responsible AI interactions.\n\nFor example, if you are using AI to help write job descriptions or review applications, how are you ensuring fairness and controlling for potential biases? When making important decisions with AI assistance, how are you verifying the accuracy of the information presented to you? Are you protecting sensitive data? Have you considered how to be transparent about the involvement of AI? Are you willing to be accountable for the AI-assisted work you have done?\n\nDiligence means taking ownership of your AI-assisted work and being willing to stand behind final products created using AI. Diligence is critical for safe and ethical AI collaboration.\n\nTo recap, AI fluency means developing practical skills, knowledge, insights, and values that help you use AI effectively, efficiently, ethically, and safely.\n\nAI fluency includes four key competencies: delegation to decide when and how to use AI, description to communicate clearly with AI, discernment to evaluate AI outputs, and diligence to use AI responsibly.\n\nWhat makes these competencies so valuable is that they aren't tied to specific AI tools or techniques that might become outdated. Instead, they're fundamental skills that will help you adapt and grow alongside this rapidly evolving technology.\n\n\n\nThis video introduces the four core competencies of AI Fluency, or the \"4Ds\": Delegation, Description, Discernment, and Diligence.\n\n- Delegation: Thoughtfully deciding what work to do with AI vs. doing yourself\n- Description: Communicating clearly with AI systems\n- Discernment: Evaluating AI outputs and behavior with a critical eye\n- Diligence: Ensuring you interact with AI responsibly\n\nWe explore how these competencies work together across different ways of engaging with AI, and why developing these skills prepares you for whatever AI evolution brings next.\n\n#### Key takeaways\n\n- AI Fluency means engaging with AI in ways that are effective, efficient, ethical, and safe\n- There are three primary ways we engage with AI:\n  - Automation: AI executes specific tasks based on your instructions\n  - Augmentation: You and AI collaborate as creative thinking and task execution partners\n  - Agency: You guide AI to work independently on your behalf, shaping its knowledge and behavior rather than specific actions\n- The AI Fluency Framework consists of four core competencies (the 4Ds):\n  - Delegation: Deciding what work to do with AI vs. yourself\n  - Description: Communicating effectively with AI systems\n  - Discernment: Evaluating AI outputs critically\n  - Diligence: Ensuring responsible AI collaboration\n- These competencies apply across all three ways of working with AI\n- Developing these competencies prepares you for evolving AI capabilities\n\n## Exercises\n\n### Exercise 1: Apply the 4D's\n\n*Estimated time: 5 minutes*\n\nPick one of these collaboration scenarios and consider how you might apply the 4D Framework:\n\n#### Communication project\n\nYou're working with an AI assistant to draft a series of emails for a marketing campaign.\n\n- **Delegation:** What aspects of this project would you handle yourself vs. collaborate on with AI?\n- **Description:** How would you communicate your vision for the campaign's tone, purpose, and success criteria to the AI?\n- **Discernment:** What criteria would help you evaluate whether the AI-drafted emails meet your needs?\n- **Diligence:** What considerations around transparency and responsibility would be important?\n\n#### Research project\n\nYou're using AI to help analyze a large dataset for a research paper.\n\n- **Delegation:** How would you divide the analytical work between yourself and the AI?\n- **Description:** What context would the AI need to understand about your research question to do its share of the tasks well?\n- **Discernment:** How would you verify the AI's analysis for accuracy?\n- **Diligence:** What ethical considerations might arise when publishing AI-assisted research?\n\n#### Creative project\n\nYou're collaborating with AI to develop character concepts for a story.\n\n- **Delegation:** What creative elements would you want to explore through AI collaboration vs. develop independently?\n- **Description:** How might you guide the AI to generate characters that fit your story's world?\n- **Discernment:** How would you decide which AI-suggested elements to keep, modify, or discard?\n- **Diligence:** How would you acknowledge AI's contribution to your creative work?\n\n### Exercise 2: Explore something you love\n\n*Estimated time: 5-10 minutes*\n\nSpend 5-10 minutes chatting with Claude about a topic you're passionate about and know well. We will be using Claude across exercises for the rest of the course, but you can also do these exercises with another AI. In fact, it might be worthwhile for you to try the exercises across this course with several AI assistants to get a feel for how they differ.\n\nInstructions:\n\n1. Choose a topic you know well and enjoy discussing such as a hobby, professional interest, favorite book series, etc.\n2. Have a natural conversation with Claude about this topic, like you would with someone who shares your interest.\n3. Try to notice moments where:\n   1. Claude enhances your thinking\n   2. You need to clarify or correct the Claude's understanding\n   3. Your expertise leads you to evaluate the Claude's responses\n\n### Exercise 3: Learn something new\n\n*Estimated time: 5-10 minutes*\n\nSpend 5-10 minutes asking Claude to teach you about a topic you're unfamiliar with but interested in exploring. See how this experience differs from your conversation about something you love and know well.\n\nInstructions:\n\n1. Choose a topic you'd like to learn more about.\n2. Engage Claude in a conversation to help you understand the basics of this topic. Don't worry about prompting the \"wrong way\" or the \"right way.\" Just ask Claude to teach you.\n3. Try to notice moments where the Claude:\n   1. Offers helpful explanations\n   2. Provides examples that make abstract ideas concrete\n   3. Responds naturally to your questions as they arise\n   4. Explains things where you would want to double check its explanations\n\n### Reflection\n\nBefore moving on, take a moment to consider:\n\n- Which of the 4Ds (Delegation, Description, Discernment, Diligence) do you feel most confident in already? Which might need more development?\n- Can you recall a recent AI interaction where the framework might have helped?\n- What specific skills from the 4D framework would most enhance your work or personal projects?\n\n#### What's next\n\nThe next lesson, Deep Dive 1: \"What is Generative AI?\" is a two-part technical lesson that explains the foundational workings of modern AI, how it differs from previous technologies, and its current capabilities and limitations. This knowledge will provide valuable context for the 4Ds and especially strengthen your Delegation competence.\n"

<script>
"use strict";
const data = JSON.parse(document.getElementById("lesson-data").textContent);
const LS = key => "etai:" + data.week + ":" + key;
document.title = data.week.toUpperCase() + " — " + data.title;

/* ---------- tiny helpers ---------- */
const el = (tag, attrs, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (child == null) continue;
    node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
};
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const escAttr = s => escHtml(s).replace(/"/g, "&quot;");
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const isTodo = s => typeof s === "string" && /^\s*TODO/i.test(s);

/* Fisher-Yates: an unbiased shuffle. sort(() => Math.random() - 0.5) is not. */
const shuffled = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* Quiz explanations point at options with {{opt:b}} / {{opt:b,c}} instead of
   naming a position, so the text stays true after the options are shuffled.
   The token resolves to the ordinal of where that option actually sits now. */
const ORDINAL_WORDS = ["first", "second", "third", "fourth"];
const resolveOptionRefs = (text, order) =>
  String(text).replace(/\{\{opt:([a-z](?:,[a-z])*)\}\}/g, (whole, ids) => {
    const positions = ids.split(",").map(id => order.findIndex(o => o.id === id));
    if (positions.some(i => i < 0 || i >= ORDINAL_WORDS.length)) return whole;
    return positions.sort((x, y) => x - y).map(i => ORDINAL_WORDS[i]).join(" and ");
  });

/* Minimal markdown: ## headings, - lists, paragraphs, **bold**, *italic*. */
function mdToHtml(md) {
  const inline = s => s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return md.trim().split(/\n\s*\n/).map(block => {
    const b = block.trim();
    const h = b.match(/^(#{1,4})\s+(.*)$/s);
    if (h) return "<h3>" + inline(escHtml(h[2])) + "</h3>";
    const lines = b.split("\n").map(l => l.trim());
    if (lines.every(l => /^[-*]\s+/.test(l)))
      return "<ul>" + lines.map(l => "<li>" + inline(escHtml(l.replace(/^[-*]\s+/, ""))) + "</li>").join("") + "</ul>";
    return "<p>" + inline(escHtml(b)).replace(/\n/g, "<br>") + "</p>";
  }).join("\n");
}

/* Wrap vocabulary terms in the reading text with a tooltip span.
   Single-pass alternation regex, applied to text between tags only. */
function highlightTerms(html) {
  const vocab = data.vocabulary.filter(v => v.term && !isTodo(v.term));
  if (!vocab.length) return html;
  const byTerm = {};
  vocab.forEach(v => { byTerm[v.term.toLowerCase()] = v; });
  const re = new RegExp("\\b(" + vocab.map(v => escRe(v.term))
    .sort((a, b) => b.length - a.length).join("|") + ")\\b", "gi");
  return html.split(/(<[^>]+>)/).map(part => {
    if (part.startsWith("<")) return part;
    return part.replace(re, m => {
      const v = byTerm[m.toLowerCase()];
      const def = isTodo(v.definition_b1) ? "definition coming soon" : v.definition_b1;
      return '<span class="term" tabindex="0" data-def="' + escAttr(def) + '">' + m + "</span>";
    });
  }).join("");
}

/* ---------- section builders ---------- */
const main = document.getElementById("sections");
const addSection = (id, title, node) => {
  const s = el("section", { id: "sec-" + id });
  if (title) s.append(el("h2", {}, title));
  s.append(node);
  main.append(s);
  return s;
};

/* 1. Header */
{
  const s = el("div", {},
    el("p", { class: "muted" }, "English Through AI — Week " + data.week.replace(/^w0?/, "")),
    el("h1", {}, data.title),
    el("div", { class: "meta" },
      el("span", {}, "Source: " + data.source),
      el("span", {}, "Duration: " + data.duration_min + " min")
    )
  );
  addSection("header", null, s);
}

/* 2. Objectives */
{
  const ul = el("ul", {});
  data.objectives.forEach(o => ul.append(el("li", { class: isTodo(o) ? "todo" : "" }, o)));
  addSection("objectives", "Objectives", ul);
}

/* 3. Vocabulary — flip cards + quick quiz */
{
  const wrap = el("div", {});
  const grid = el("div", { id: "vocab-grid" });
  data.vocabulary.forEach(v => {
    const back = el("div", { class: "card-face card-back" },
      el("strong", {}, v.term),
      el("span", { class: isTodo(v.definition_b1) ? "todo" : "" }, v.definition_b1),
      el("span", { class: "colloc" }, (v.collocations || []).join(" · ")),
      v.example ? el("span", { class: "example" }, v.example) : null,
      el("span", { class: "ua" }, v.ua)
    );
    const card = el("div", { class: "card", tabindex: "0", role: "button",
        "aria-label": "Vocabulary card: " + v.term },
      el("div", { class: "card-inner" },
        el("div", { class: "card-face card-front" }, v.term), back));
    const flip = () => card.classList.toggle("flipped");
    card.addEventListener("click", flip);
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
    grid.append(card);
  });
  wrap.append(grid);

  const validTerms = data.vocabulary.filter(v => v.term && !isTodo(v.term) && v.definition_b1 && !isTodo(v.definition_b1));
  if (validTerms.length >= 3) {
    const quizBlock = el("div", { id: "vocab-quiz-block" },
      el("h3", {}, "Vocabulary Quiz"),
      el("p", { class: "muted" }, "Match the definition with the correct word.")
    );
    const app = el("div", { id: "vocab-quiz-app", style: "margin-top: 16px;" });
    quizBlock.append(app);
    wrap.append(quizBlock);

    const shuffle = shuffled;
    let qList = shuffle(validTerms);
    let qIdx = 0;
    let score = 0;

    function renderVocabQ() {
      app.replaceChildren();
      const current = qList[qIdx];
      const otherTerms = validTerms.filter(t => t.term !== current.term);
      const distractors = shuffle(otherTerms).slice(0, 2);
      const opts = shuffle([current, ...distractors]);

      const progress = el("p", { class: "quiz-progress" }, "Question " + (qIdx + 1) + " of " + qList.length);
      const prompt = el("p", { class: "quiz-prompt", style: "font-weight: 500;" }, current.definition_b1);
      app.append(progress, prompt);

      const buttons = [];
      opts.forEach(item => {
        const btn = el("button", { class: "quiz-option" }, item.term);
        btn.addEventListener("click", () => {
          buttons.forEach(b => {
            b.disabled = true;
            if (b.dataset.term === current.term) b.classList.add(b === btn ? "chosen-correct" : "revealed-correct");
            else if (b === btn) b.classList.add("chosen-incorrect");
          });
          if (item.term === current.term) score++;

          const next = el("button", { class: "btn-primary", style: "margin-top: 18px;" },
            qIdx + 1 < qList.length ? "Next word" : "Finish");
          next.addEventListener("click", () => {
            qIdx++;
            qIdx < qList.length ? renderVocabQ() : renderVocabSummary();
          });
          app.append(next);
        });
        btn.dataset.term = item.term;
        buttons.push(btn);
        app.append(btn);
      });
    }

    function renderVocabSummary() {
      app.replaceChildren(
        el("h3", {}, "Result: " + score + " / " + qList.length),
        el("p", { class: "muted" }, score === qList.length ? "Perfect score! All terms mastered." : "Great practice!"),
        el("button", { class: "btn-primary", style: "margin-top: 12px;", onclick: () => {
          qList = shuffle(validTerms);
          qIdx = 0;
          score = 0;
          renderVocabQ();
        } }, "Restart quiz")
      );
    }

    renderVocabQ();
  }

  addSection("vocabulary", "Vocabulary", wrap);
}

/* 3b. Pronunciation — optional. Homework item 2 is built from this data and
   pronunciation is the learner's diagnosed weakness, so it gets its own
   section when the week provides it. Weeks without it render no section. */
{
  const items = (data.pronunciation_focus || []).filter(p => p && p.word);
  if (items.length) {
    const wrap = el("div", { id: "pron-list" });
    items.forEach(p => {
      wrap.append(el("div", { class: "pron-item" },
        el("strong", {}, p.word),
        el("span", { class: "stress" }, p.stress || ""),
        el("span", { class: "why muted" }, p.why || "")));
    });
    addSection("pronunciation", "Pronunciation", wrap);
  }
}

/* 4. Reading — B1 / Original toggle, terms highlighted */
{
  const wrap = el("div", {});
  const mkVersion = (id, label, text) => {
    const d = el("div", { class: "reading-version", id: "reading-" + id });
    d.innerHTML = '<h3 class="print-only">' + label + "</h3>" +
      (isTodo(text) ? '<p class="todo">' + escHtml(text) + "</p>" : highlightTerms(mdToHtml(text)));
    return d;
  };
  const b1 = mkVersion("b1", "B1 version", data.reading.b1);
  const orig = mkVersion("orig", "Original transcript", data.reading.original);
  orig.classList.add("hidden");
  const btnB1 = el("button", { class: "active" }, "B1 version");
  const btnOrig = el("button", {}, "Original transcript");
  const select = which => {
    b1.classList.toggle("hidden", which !== "b1");
    orig.classList.toggle("hidden", which !== "orig");
    btnB1.classList.toggle("active", which === "b1");
    btnOrig.classList.toggle("active", which === "orig");
  };
  btnB1.addEventListener("click", () => select("b1"));
  btnOrig.addEventListener("click", () => select("orig"));
  wrap.append(el("div", { class: "toggle" }, btnB1, btnOrig), b1, orig);
  addSection("reading", "Reading", wrap);
}

/* 5. Quiz */
{
  const app = el("div", { id: "quiz-app" });
  const note = el("p", { class: "quiz-print-note" },
    "The quiz is interactive — open this file in a browser to take it.");
  const state = { i: 0, score: 0, reviewTerms: new Set() };

  function renderQuestion() {
    app.replaceChildren();
    const q = data.quiz[state.i];
    app.append(
      el("p", { class: "quiz-progress" }, "Question " + (state.i + 1) + " of " + data.quiz.length),
      el("p", { class: "quiz-prompt" }, q.prompt)
    );
    /* Options are shuffled on every render: the correct answer must not be
       findable by position, and a re-taken quiz must not be muscle memory. */
    const order = shuffled(q.options);
    const rows = [];
    order.forEach(opt => {
      const btn = el("button", { class: "quiz-option" }, opt.text);
      const note = el("p", { class: "option-note", hidden: "" },
        resolveOptionRefs(opt.note, order));
      btn.addEventListener("click", () => answer(q, opt, rows, order));
      rows.push({ opt, btn, note });
      app.append(btn, note);
    });
  }

  function answer(q, chosen, rows, order) {
    /* Lock all options: no re-selection — that would spoil the exercise. */
    rows.forEach(({ opt, btn, note }) => {
      btn.disabled = true;
      /* The correct option is always revealed, even when not chosen. */
      if (opt.correct) btn.classList.add(opt === chosen ? "chosen-correct" : "revealed-correct");
      else if (opt === chosen) btn.classList.add("chosen-incorrect");
      note.hidden = false;
    });
    if (chosen.correct) state.score++;
    else (q.term_refs || []).forEach(t => state.reviewTerms.add(t));

    /* One explanation per question — the main content after answering. */
    const exp = el("div", { class: "quiz-explanation" },
      el("span", { class: "verdict " + (chosen.correct ? "v-correct" : "v-incorrect") },
        chosen.correct ? "Correct" : "Not quite"),
      resolveOptionRefs(q.explanation, order));
    const next = el("button", { class: "btn-primary" },
      state.i + 1 < data.quiz.length ? "Next" : "Finish");
    next.addEventListener("click", () => {
      state.i++;
      state.i < data.quiz.length ? renderQuestion() : renderSummary();
    });
    app.append(exp, next);
    requestAnimationFrame(() => requestAnimationFrame(() => exp.classList.add("show")));
  }

  function renderSummary() {
    app.replaceChildren(
      el("h3", {}, "Result: " + state.score + " / " + data.quiz.length),
      state.reviewTerms.size
        ? el("div", {}, el("p", {}, "Terms to review:"),
            el("ul", {}, ...[...state.reviewTerms].map(t => el("li", {}, t))))
        : el("p", {}, "Nothing flagged for review — well done."),
      el("button", { class: "btn-primary", onclick: () => {
        state.i = 0; state.score = 0; state.reviewTerms.clear(); renderQuestion();
      } }, "Restart quiz")
    );
  }

  if (data.quiz.length) renderQuestion();
  else app.append(el("p", { class: "todo" }, "TODO: quiz questions"));
  const holder = el("div", {}, app, note);
  addSection("quiz", "Quiz", holder);
}

/* 6. Speaking prompts — big type, 60 s timer each */
{
  const wrap = el("div", {});
  data.speaking_prompts.forEach(p => {
    const display = el("span", { class: "timer-display" }, "60");
    const btn = el("button", {}, "Start 60 s");
    let interval = null;
    btn.addEventListener("click", () => {
      clearInterval(interval);
      let left = 60;
      display.textContent = left;
      display.className = "timer-display running";
      interval = setInterval(() => {
        left--;
        display.textContent = left;
        if (left <= 0) {
          clearInterval(interval);
          display.textContent = "Time!";
          display.className = "timer-display done";
        }
      }, 1000);
    });
    wrap.append(el("div", { class: "speaking-item" },
      el("p", { class: "prompt-text " + (isTodo(p) ? "todo" : "") }, p),
      el("div", { class: "timer" }, btn, display)));
  });
  addSection("speaking", "Speaking", wrap);
}

/* 7. Homework — checklist persisted to localStorage */
{
  const wrap = el("div", {});
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(LS("homework")) || "[]"); } catch (e) { saved = []; }
  data.homework.forEach((h, i) => {
    const cb = el("input", { type: "checkbox", id: "hw-" + i });
    cb.checked = !!saved[i];
    cb.addEventListener("change", () => {
      saved[i] = cb.checked;
      localStorage.setItem(LS("homework"), JSON.stringify(saved));
    });
    wrap.append(el("div", { class: "hw-item" }, cb,
      el("label", { for: "hw-" + i, class: isTodo(h) ? "todo" : "" }, h)));
  });
  addSection("homework", "Homework", wrap);
}

/* ---------- navigation, presentation mode, progress ---------- */
const sections = [...document.querySelectorAll("main > section")];
const nav = document.getElementById("nav");
const bar = document.getElementById("progress-bar");
const navButtons = sections.map((s, i) => {
  const label = s.querySelector("h2") ? s.querySelector("h2").textContent : "Start";
  const b = el("button", { onclick: () => setCurrent(i, true) }, label);
  nav.append(b);
  return b;
});
nav.append(el("span", { class: "hint" }, "← → sections · P presentation · F fullscreen"));

let current = 0;
function setCurrent(i, scroll) {
  current = Math.max(0, Math.min(sections.length - 1, i));
  navButtons.forEach((b, j) => b.classList.toggle("active", j === current));
  sections.forEach((s, j) => s.classList.toggle("active", j === current));
  bar.style.width = ((current + 1) / sections.length * 100) + "%";
  if (scroll && !document.body.classList.contains("presentation"))
    sections[current].scrollIntoView({ behavior: "smooth", block: "start" });
  if (document.body.classList.contains("presentation")) window.scrollTo(0, 0);
}
setCurrent(0, false);

document.addEventListener("keydown", e => {
  const t = e.target.tagName;
  if (t === "INPUT" || t === "TEXTAREA" || t === "AUDIO") return;
  if (e.key === "ArrowRight") setCurrent(current + 1, true);
  else if (e.key === "ArrowLeft") setCurrent(current - 1, true);
  else if (e.key === "f" || e.key === "F") {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  } else if (e.key === "p" || e.key === "P") {
    document.body.classList.toggle("presentation");
    setCurrent(current, false);
  }
});
</script>
